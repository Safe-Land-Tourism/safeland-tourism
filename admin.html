<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>DubaiTickets Admin</title>

  <link rel="stylesheet" href="style.css">

</head>


<body class="admin-page">


<header class="admin-header">

  <div class="container admin-nav">

    <div class="admin-logo">
      Dubai<span>Tickets</span> Admin
    </div>

    <a
      href="index.html"
      class="admin-btn gray"
    >
      View Website
    </a>

  </div>

</header>


<main class="admin-container">


  <div class="admin-top">

    <div>

      <p class="eyebrow">
        WEBSITE MANAGEMENT
      </p>

      <h1>
        Attraction Manager
      </h1>

      <p>
        এখান থেকে coding ছাড়াই আপনার attraction manage করুন।
      </p>

    </div>

    <button
      class="admin-btn primary"
      onclick="showAddForm()"
    >
      + Add Attraction
    </button>

  </div>


  <div id="notice" class="notice">
    Saved successfully!
  </div>


  <!-- ================= FORM ================= -->

  <div
    id="editorCard"
    class="admin-card"
    style="display:none;"
  >

    <h2 id="formTitle">
      Add Attraction
    </h2>


    <form id="attractionForm" class="admin-form">


      <input
        type="hidden"
        id="editId"
      >


      <div>

        <label>
          Attraction Name

          <input
            type="text"
            id="name"
            placeholder="Burj Khalifa"
            required
          >

        </label>

      </div>


      <div>

        <label>
          Location

          <input
            type="text"
            id="location"
            placeholder="Downtown Dubai"
            required
          >

        </label>

      </div>


      <div>

        <label>
          Category

          <select id="category">

            <option value="landmark">
              Landmark
            </option>

            <option value="themepark">
              Theme Park
            </option>

            <option value="museum">
              Museum
            </option>

            <option value="aquarium">
              Aquarium
            </option>

            <option value="cruise">
              Cruise
            </option>

            <option value="adventure">
              Adventure
            </option>

          </select>

        </label>

      </div>


      <div>

        <label>
          Category Name

          <input
            type="text"
            id="categoryName"
            placeholder="Landmark"
            required
          >

        </label>

      </div>


      <div>

        <label>
          Adult Price (AED)

          <input
            type="number"
            id="price"
            min="0"
            placeholder="159"
            required
          >

        </label>

      </div>


      <div>

        <label>
          Child Price (AED)

          <input
            type="number"
            id="childPrice"
            min="0"
            placeholder="129"
            required
          >

        </label>

      </div>


      <div class="full">

        <label>
          Image URL

          <input
            type="url"
            id="image"
            placeholder="https://..."
            required
          >

        </label>

      </div>


      <div class="full">

        <label>
          Description

          <textarea
            id="description"
            rows="4"
            placeholder="Write attraction description..."
            required
          ></textarea>

        </label>

      </div>


      <div class="full admin-actions">

        <button
          type="submit"
          class="admin-btn primary"
        >
          💾 Save Attraction
        </button>


        <button
          type="button"
          class="admin-btn gray"
          onclick="cancelEdit()"
        >
          Cancel
        </button>

      </div>


    </form>

  </div>


  <!-- ================= LIST ================= -->

  <div class="admin-card">

    <h2>
      Your Attractions
    </h2>

    <div
      id="adminList"
      class="admin-list"
    ></div>

  </div>


</main>


<script>


// =====================================================
// DEFAULT DATA
// =====================================================

const defaultAttractions = [

  {
    id: 1,
    name: "Burj Khalifa",
    category: "landmark",
    categoryName: "Landmark",
    location: "Downtown Dubai",
    price: 159,
    childPrice: 129,
    image: "https://images.unsplash.com/photo-1518684079-3c830dcef090?auto=format&fit=crop&w=1000&q=80",
    description: "Enjoy breathtaking views from one of Dubai's most iconic landmarks."
  },

  {
    id: 2,
    name: "Dubai Aquarium & Underwater Zoo",
    category: "aquarium",
    categoryName: "Aquarium",
    location: "Dubai Mall",
    price: 125,
    childPrice: 99,
    image: "https://images.unsplash.com/photo-1546026423-cc4642628d2b?auto=format&fit=crop&w=1000&q=80",
    description: "Discover amazing marine life at Dubai Aquarium and Underwater Zoo."
  }

];


// =====================================================
// DATA
// =====================================================

function getData() {

  const data =
    localStorage.getItem(
      "dubaiTicketsAttractions"
    );

  if (data) {
    return JSON.parse(data);
  }

  localStorage.setItem(
    "dubaiTicketsAttractions",
    JSON.stringify(defaultAttractions)
  );

  return defaultAttractions;

}


let attractions = getData();


// =====================================================
// ELEMENTS
// =====================================================

const editorCard =
  document.getElementById("editorCard");

const attractionForm =
  document.getElementById("attractionForm");

const adminList =
  document.getElementById("adminList");

const notice =
  document.getElementById("notice");


// =====================================================
// SHOW LIST
// =====================================================

function renderList() {

  adminList.innerHTML = "";


  if (attractions.length === 0) {

    adminList.innerHTML =
      "<p>No attractions added yet.</p>";

    return;

  }


  attractions.forEach(function(item) {

    const div =
      document.createElement("div");

    div.className = "admin-item";


    div.innerHTML = `

      <img
        src="${item.image}"
        alt="${item.name}"
      >

      <div class="admin-item-info">

        <h3>
          ${item.name}
        </h3>

        <p>
          📍 ${item.location}
        </p>

        <p>
          Adult AED ${item.price}
          • Child AED ${item.childPrice}
        </p>

      </div>


      <div class="admin-item-actions">

        <button
          class="admin-btn dark"
          onclick="editAttraction(${item.id})"
        >
          Edit
        </button>

        <button
          class="admin-btn danger"
          onclick="deleteAttraction(${item.id})"
        >
          Delete
        </button>

      </div>

    `;


    adminList.appendChild(div);

  });

}


// =====================================================
// ADD
// =====================================================

function showAddForm() {

  attractionForm.reset();

  document.getElementById("editId").value = "";

  document.getElementById(
    "formTitle"
  ).textContent = "Add Attraction";

  editorCard.style.display = "block";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


// =====================================================
// EDIT
// =====================================================

function editAttraction(id) {

  const item =
    attractions.find(
      attraction => attraction.id === id
    );


  if (!item) return;


  document.getElementById("editId").value =
    item.id;

  document.getElementById("name").value =
    item.name;

  document.getElementById("location").value =
    item.location;

  document.getElementById("category").value =
    item.category;

  document.getElementById("categoryName").value =
    item.categoryName;

  document.getElementById("price").value =
    item.price;

  document.getElementById("childPrice").value =
    item.childPrice;

  document.getElementById("image").value =
    item.image;

  document.getElementById("description").value =
    item.description;


  document.getElementById(
    "formTitle"
  ).textContent = "Edit Attraction";


  editorCard.style.display = "block";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


// =====================================================
// SAVE
// =====================================================

attractionForm.addEventListener(
  "submit",
  function(event) {

    event.preventDefault();


    const editId =
      document.getElementById("editId").value;


    const item = {

      id:
        editId
          ? Number(editId)
          : Date.now(),

      name:
        document.getElementById("name").value.trim(),

      location:
        document.getElementById("location").value.trim(),

      category:
        document.getElementById("category").value,

      categoryName:
        document.getElementById("categoryName").value.trim(),

      price:
        Number(
          document.getElementById("price").value
        ),

      childPrice:
        Number(
          document.getElementById("childPrice").value
        ),

      image:
        document.getElementById("image").value.trim(),

      description:
        document.getElementById("description").value.trim()

    };


    if (editId) {

      attractions =
        attractions.map(function(oldItem) {

          return oldItem.id === Number(editId)
            ? item
            : oldItem;

        });

    } else {

      attractions.push(item);

    }


    saveData();

    attractionForm.reset();

    editorCard.style.display = "none";

    showNotice("Attraction saved successfully!");

  }
);


// =====================================================
// DELETE
// =====================================================

function deleteAttraction(id) {

  const item =
    attractions.find(
      attraction => attraction.id === id
    );


  if (!item) return;


  const confirmDelete =
    confirm(
      "Delete " + item.name + "?"
    );


  if (!confirmDelete) return;


  attractions =
    attractions.filter(
      attraction => attraction.id !== id
    );


  saveData();

  showNotice("Attraction deleted.");

}


// =====================================================
// CANCEL
// =====================================================

function cancelEdit() {

  attractionForm.reset();

  editorCard.style.display = "none";

}


// =====================================================
// SAVE DATA
// =====================================================

function saveData() {

  localStorage.setItem(
    "dubaiTicketsAttractions",
    JSON.stringify(attractions)
  );

  renderList();

}


// =====================================================
// NOTICE
// =====================================================

function showNotice(text) {

  notice.textContent = text;

  notice.style.display = "block";


  setTimeout(function() {

    notice.style.display = "none";

  }, 2500);

}


// =====================================================
// START
// =====================================================

renderList();

</script>

</body>
</html>
